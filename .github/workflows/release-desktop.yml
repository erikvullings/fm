name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: Signed and notarized macOS bundles
    runs-on: macos-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install universal macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Require tag to match the Cargo-owned desktop version
        run: node scripts/check-desktop-release.mjs "$GITHUB_REF_NAME"
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          APPLE_SIGNING_IDENTITY="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -1)"
          test -n "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Build, sign and notarize macOS bundles
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm run build:tauri --target universal-apple-darwin
      - name: Verify macOS signatures and notarization tickets
        run: |
          codesign --verify --deep --strict --verbose=2 target/universal-apple-darwin/release/bundle/macos/Procyon.app
          xcrun stapler validate target/universal-apple-darwin/release/bundle/macos/Procyon.app
          xcrun stapler validate target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg

  windows:
    name: Signed Windows installers
    runs-on: windows-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require tag to match the Cargo-owned desktop version
        run: node scripts/check-desktop-release.mjs "$env:GITHUB_REF_NAME"
      - name: Import Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("certificate.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
      - name: Build and sign Windows installers
        env:
          FM_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: pnpm run build:tauri
      - name: Verify Windows installer signatures
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle -Recurse -Include *.msi,*-setup.exe |
            ForEach-Object { signtool verify /pa /v $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe

  homebrew:
    name: Publish Homebrew cask
    needs: [macos]
    runs-on: macos-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - name: Download the notarized DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "*.dmg" --dir package-input
      - name: Generate the cask from the released asset
        run: |
          DMG_PATH="$(find package-input -type f -name '*.dmg' -print -quit)"
          test -n "$DMG_PATH"
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256="$(shasum -a 256 "$DMG_PATH" | cut -d ' ' -f 1)"
          node scripts/generate-package-manager-files.mjs homebrew \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --repository "$GITHUB_REPOSITORY" \
            --asset "$(basename "$DMG_PATH")" \
            --output generated-cask/procyon.rb
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Commit the cask to the tap
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          mkdir -p homebrew-tap/Casks
          cp generated-cask/procyon.rb homebrew-tap/Casks/procyon.rb
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/procyon.rb
          git -C homebrew-tap diff --cached --quiet && exit 0
          git -C homebrew-tap commit -m "procyon ${GITHUB_REF_NAME#v}"
          git -C homebrew-tap push

  chocolatey:
    name: Publish Chocolatey package
    needs: windows
    runs-on: windows-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@v5
      - name: Download the signed NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:GITHUB_REF_NAME" --pattern "*-setup.exe" --dir package-input
      - name: Generate and pack the Chocolatey package
        shell: pwsh
        run: |
          $installer = Get-ChildItem package-input -Filter *-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "The GitHub release has no NSIS setup executable" }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $checksum = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          node scripts/generate-package-manager-files.mjs chocolatey `
            --version $version `
            --sha256 $checksum `
            --repository $env:GITHUB_REPOSITORY `
            --asset $installer.Name `
            --output chocolatey-package
          choco pack chocolatey-package/procyon.nuspec --output-directory chocolatey-output
      - name: Push to the Chocolatey Community Repository
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $package = Get-ChildItem chocolatey-output -Filter *.nupkg | Select-Object -First 1
          if (-not $package) { throw "Chocolatey package was not created" }
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
