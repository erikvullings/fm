[package]
name = "fm-desktop"
description = "Tauri 2 desktop host embedding the same frontend and FileManagerService as fm-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `scripts/build-tauri.mjs` reads this through `cargo metadata` and supplies it
# to Tauri as a generated config overlay. Keep desktop identity in this one
# Cargo-owned source so the resolved workspace crate version cannot drift from
# installer metadata.
[package.metadata.desktop]
product-name = "Procyon"
identifier = "dev.fm.desktop"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]

[lib]
# A library target lets the mock-runtime smoke test build the same `run`
# entry point `main.rs` calls, matching `fm-server`'s `lib.rs`/`main.rs` split.
name = "fm_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
fm-application.workspace = true
fm-credentials.workspace = true
fm-domain.workspace = true
fm-events.workspace = true
fm-platform.workspace = true
fm-transport-dto.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
uuid.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
drag.workspace = true
fm-credentials-macos.workspace = true
fm-platform-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
drag.workspace = true
fm-credentials-windows.workspace = true
fm-platform-windows.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
